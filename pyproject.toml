[project]
name = "runespeak-lite"
version = "0.1.0a1"
description = "Local Linux webpage and clipboard narration with Phonon"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = ["Development Status :: 3 - Alpha", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]
requires-python = ">=3.11"
dependencies = ["ptts", "trafilatura>=2,<3", "tkinterdnd2>=0.4,<0.5", "pillow>=11,<13"]

[project.scripts]
runespeak = "runespeak.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runespeak"]

[tool.hatch.build.targets.sdist]
include = ["runespeak/", "scripts/", "assets/", "firefox-extension/", "tests/", "docs/", ".github/", "README.md", "LICENSE", "NOTICE", "pyproject.toml", "uv.lock", ".gitignore"]
