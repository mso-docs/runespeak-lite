[project]
name = "runespeak-lite"
version = "0.1.0a1"
description = "Local webpage, document and clipboard narration with Phonon for Linux, macOS and Windows"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = ["Development Status :: 3 - Alpha", "Operating System :: POSIX :: Linux", "Operating System :: MacOS", "Operating System :: Microsoft :: Windows", "Programming Language :: Python :: 3"]
requires-python = ">=3.11"
dependencies = ["ptts", "trafilatura>=2,<3", "tkinterdnd2>=0.7,<0.8", "pillow>=11,<13", "pypdfium2>=4.30,<6", "sounddevice>=0.5,<0.6; sys_platform == 'darwin' or sys_platform == 'win32'"]

[project.scripts]
runespeak = "runespeak.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runespeak"]

[tool.hatch.build.targets.sdist]
include = ["runespeak/", "scripts/", "packaging/", "assets/", "firefox-extension/", "tests/", "docs/", ".github/", "README.md", "LICENSE", "NOTICE", "pyproject.toml", "uv.lock", ".gitignore"]
